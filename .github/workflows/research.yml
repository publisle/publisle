name: Research export

on:
  workflow_call:

jobs:
  starter-profiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install local TeX and PDF tooling
        run: |
          bash tools/ci-apt-sources.sh
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-publishers texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-lang-arabic texlive-lang-chinese fonts-paktype fonts-texgyre fonts-texgyre-math fontconfig poppler-utils libxml2-utils default-jre-headless
          # apt TeX Live keeps fonts inside the texmf tree, which fontconfig
          # does not index; register it so native compiler completeness checks
          # (fc-match) see Fandol and the other TeX font families.
          sudo tee /etc/fonts/local.conf > /dev/null <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <dir>/usr/share/texlive/texmf-dist/fonts</dir>
          </fontconfig>
          XML
          sudo fc-cache -f
      # Validate the immutable compiler that the npm packages actually ship.
      # Compiler builds have their own release workflow and verification gates.
      - name: Install the published compiler pinned by the packages
        run: pnpm cli setup compiler
      - name: Install checksum-pinned veraPDF
        run: |
          node tools/install-verapdf.mjs "$RUNNER_TEMP/verapdf"
          echo "$RUNNER_TEMP/verapdf" >> "$GITHUB_PATH"
      - name: Validate tagged standard articles against PDF/UA-2
        run: pnpm test:pdf-ua
        env:
          PUBLISLE_RESEARCH_ARTIFACTS: ${{ runner.temp }}/publisle-ieee/pdf-ua
      - run: pnpm test:research
        env:
          PUBLISLE_CONTAINER_TEST: "1"
          PUBLISLE_RESEARCH_ARTIFACTS: ${{ runner.temp }}/publisle-ieee
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: research-exports-and-pdf-ua-reports
          overwrite: true
          path: ${{ runner.temp }}/publisle-ieee
          if-no-files-found: warn
