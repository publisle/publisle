name: Check

on:
  workflow_call:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=${{ runner.temp }}/unit.json
      - run: pnpm build:examples
      - run: pnpm test:python
      - run: pnpm test:conformance:renderer

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - name: Install browser
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright-core install chromium
          else
            bash tools/ci-apt-sources.sh
            pnpm exec playwright-core install --with-deps chromium
          fi

      - run: pnpm test:conformance:p0 -- --unit-report ${{ runner.temp }}/unit.json
