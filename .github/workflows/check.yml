name: Check

on:
  workflow_call:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm docs:check

      - run: pnpm test:python

      - run: pnpm test:pdf-service

      - run: pnpm test:conformance:renderer

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - run: bash tools/ci-apt-sources.sh
      - run: pnpm exec playwright-core install --with-deps chromium

      - run: pnpm test:conformance:p0
