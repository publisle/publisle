name: Site

# Validate site changes in pull requests; deploy main to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "sites/www/**"
      - "docs/**"
      - "packages/playground/**"
      - "packages/adapter-astro/**"
      - "packages/adapter-core/**"
      - ".github/workflows/site.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "sites/www/**"
      - "docs/**"
      - "packages/playground/**"
      - "packages/adapter-astro/**"
      - "packages/adapter-core/**"
      - ".github/workflows/site.yml"
      - "vitest.acceptance.config.ts"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm --filter @publisle/www check
      - name: Build
        run: |
          # Write the public build configuration as a mode env file: process-env
          # plumbing for import.meta.env replacement has proven unreliable on CI
          # runners, while mode env files are core Vite behavior.
          printf 'PUBLIC_API_URL=%s\nPUBLIC_PDF_ENABLED=%s\n' \
            "${{ vars.PUBLIC_API_URL || 'https://api.publisle.xyz' }}" \
            "${{ vars.PUBLIC_PDF_ENABLED || 'false' }}" > sites/www/.env.production
          pnpm --filter @publisle/www build
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - run: bash tools/ci-apt-sources.sh
      - name: Install browser
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Playground browser regression
        run: pnpm exec vitest run --config vitest.acceptance.config.ts sites/www/tests/playground.acceptance.test.ts
      - name: Link check (internal links must resolve; known-flaky hosts ignored)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2 --offline
            --root-dir '${{ github.workspace }}/sites/www/dist' --index-files index.html
            './sites/www/dist/**/*.html' --exclude-file .lycheeignore
          fail: true
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: sites/www/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
