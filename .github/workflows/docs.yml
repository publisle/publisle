name: Documentation
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm readmes:check
      - run: pnpm docs:check
      - run: pnpm exec markdownlint-cli2
      - uses: errata-ai/vale-action@v3
        with:
          version: 3.24.0
          files: '["README.md", "docs", "packages", "blocks"]'
          fail_on_error: true
      - uses: lycheeverse/lychee-action@v2
        if: github.event_name == 'schedule'
        with:
          args: --no-progress --max-retries 2 --exclude-file .lycheeignore './docs/**/*.md' './README.md'
          fail: true
