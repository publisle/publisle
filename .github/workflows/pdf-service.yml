name: Internal website PDF service

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: pdf-service-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  local-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tools/tests/pdf-tooling.test.mjs
      - run: bash tools/ci-apt-sources.sh
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils default-jre-headless
      - run: pnpm --filter @publisle/pdf-service build
      - run: docker build -f deploy/vps/worker.Dockerfile -t publisle-pdf-worker:local .
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: node tools/install-verapdf.mjs "$RUNNER_TEMP/verapdf"
      - name: Exercise compiler layouts, PDF objects, accessibility and website downloads
        shell: bash
        run: |
          export PDF_TEST_WORKER_IMAGE="$(docker image inspect publisle-pdf-worker:local --format '{{.Id}}')"
          export PDF_TEST_VERAPDF="$RUNNER_TEMP/verapdf/verapdf"
          export PDF_TEST_ARTIFACTS="$RUNNER_TEMP/pdf-service-artifacts"
          export PUBLISLE_BROWSER_PATH="$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')"
          node --test --test-concurrency=1 deploy/vps/tests/*.test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: internal-pdf-service-validation
          path: ${{ runner.temp }}/pdf-service-artifacts
          if-no-files-found: ignore

  native-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tools/tests/pdf-tooling.test.mjs
      - run: bash tools/ci-apt-sources.sh
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils default-jre-headless
      - run: pnpm exec vitest run packages/research/tests/native.test.ts packages/research/tests/native-install.test.ts packages/research/tests/native-report.test.ts packages/pdf-service/tests/worker.test.ts --maxWorkers=1
      - run: pnpm typecheck
      - run: pnpm exec eslint packages/research/src/native*.ts packages/pdf-service/src/worker.ts packages/pdf-service/tests/worker.test.ts packages/research/tests/native*.test.ts
      - run: pnpm --filter @publisle/pdf-service build
      - run: docker build -f deploy/vps/native-worker.Dockerfile -t publisle-pdf-native:local .
      - name: Extract the exact image compiler and fonts for Node API tests
        run: |
          CID=$(docker create publisle-pdf-native:local)
          docker cp "$CID:/usr/local/bin/publisle-pdf" "$RUNNER_TEMP/publisle-pdf"
          docker cp "$CID:/app/fonts" "$RUNNER_TEMP/fonts"
          docker cp "$CID:/app/native-fonts.json" "$RUNNER_TEMP/native-fonts.json"
          docker rm "$CID"
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          const fonts = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/native-fonts.json`));
          for (const font of fonts) font.path = font.path.replace('/app', process.env.RUNNER_TEMP);
          writeFileSync(`${process.env.RUNNER_TEMP}/native-fonts.json`, JSON.stringify(fonts));
          JS
      - run: node tools/install-verapdf.mjs "$RUNNER_TEMP/verapdf"
      - name: Validate every native candidate independently
        shell: bash
        run: |
          export PDF_TEST_NATIVE_WORKER_IMAGE="$(docker image inspect publisle-pdf-native:local --format '{{.Id}}')"
          export PDF_TEST_VERAPDF="$RUNNER_TEMP/verapdf/verapdf"
          export PDF_TEST_ARTIFACTS="$RUNNER_TEMP/native-pdf-artifacts"
          export PUBLISLE_NATIVE_COMPILER="$RUNNER_TEMP/publisle-pdf"
          export PUBLISLE_NATIVE_FONTS="$RUNNER_TEMP/native-fonts.json"
          node --test --test-concurrency=1 deploy/vps/tests/native.test.mjs deploy/vps/tests/native-standards.test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-pdf-validation
          path: ${{ runner.temp }}/native-pdf-artifacts
          if-no-files-found: ignore
