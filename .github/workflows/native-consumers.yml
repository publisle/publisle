name: External native Research consumers
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        id: pnpm
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: node tools/native-consumer-proof.mjs
        env:
          PNPM_CLI_PATH: ${{ steps.pnpm.outputs.dest }}/node_modules/pnpm/bin/pnpm.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: external-native-consumer-${{ runner.os }}
          path: ${{ runner.temp }}/publisle-native-consumer-*/consumer/native-consumer-proof.pdf
          if-no-files-found: ignore
